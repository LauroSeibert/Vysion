name: Build release

# Builds Vysion.exe, the portable zip and the installer for a tag, and uploads them to that tag's release.
# Runs when a release is published, or by hand from the Actions tab. Leave the tag empty for a test build:
# the files are kept as a downloadable artifact on the run instead of going to a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.0 (empty = test build)"
        required: false
      ref:
        description: "Branch or commit to build from (defaults to the tag)"
        required: false

permissions:
  contents: write

env:
  # Release whose portable zip supplies the bundled mpv.dll
  DLL_FROM: v0.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG || github.ref }}

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix nsis zip

      - name: Build Vysion.exe
        run: ./build.sh

      - name: Cache ffmpeg.exe
        id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg.exe
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg.exe (stream copy only)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh

      - name: Test lossless cut
        timeout-minutes: 6
        run: |
          sudo apt-get install -y wine64 ffmpeg >/dev/null
          timeout 120 wineboot -i >/dev/null 2>&1 || true
          ffmpeg -v error -f lavfi -i testsrc2=duration=10:size=320x240:rate=30 -f lavfi -i sine=duration=10             -c:v libx264 -g 60 -c:a aac -shortest sample.mp4
          # same arguments Vysion uses: start snaps back to the keyframe at 4.0s
          WINEDEBUG=-all timeout 90 wine build/ffmpeg.exe -hide_banner -v error -nostdin -y -ss 5.2 -to 8.5 -i sample.mp4             -map 0 -dn -c copy -avoid_negative_ts make_zero -map_metadata 0 cut.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 cut.mp4
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 cut.mp4)
          awk -v d="$d" 'BEGIN { exit !(d > 4.0 && d < 4.9) }'
          [ "$(ffprobe -v error -select_streams v -show_entries stream=codec_name -of csv=p=0 cut.mp4)" = h264 ]
          # keyframe probe Vysion uses to show where the cut really starts
          # (first packet's pts is negative: keyframe = 5.2 + pts, expected 4.0)
          WINEDEBUG=-all timeout 90 wine build/ffmpeg.exe -hide_banner -v error -nostdin -ss 5.2 -i sample.mp4             -map 0:v:0 -c copy -frames:v 1 -avoid_negative_ts disabled -f framecrc - | tee probe.txt
          awk -F'[ ,/]+' '/^#tb 0:/ { num = $3; den = $4 } !/^#/ && NF > 2 && !done { k = 5.2 + $3 * num / den; done = 1 }
            END { print "keyframe:", k; exit !(k > 3.99 && k < 4.01) }' probe.txt
          # a container the bundled build can't write falls back to .mkv in the app; check that works
          WINEDEBUG=-all timeout 90 wine build/ffmpeg.exe -hide_banner -v error -nostdin -y -ss 2 -to 6 -i sample.mp4 -map 0 -dn -c copy cut.mkv
          ls -la build/ffmpeg.exe

      - name: Get mpv.dll
        run: |
          gh release download "$DLL_FROM" -R "$GITHUB_REPOSITORY" -p '*portable*.zip' -D dl
          unzip -j dl/*.zip '*/mpv.dll' -d build

      - name: Package
        run: |
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"; makensis -DVERSION="$VERSION" installer/vysion.nsi
          else  # test build: installer keeps the version written in the code
            VERSION="test-${GITHUB_SHA::7}"; makensis installer/vysion.nsi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p pkg/Vysion
          cp build/Vysion.exe build/mpv.dll build/ffmpeg.exe README.md pkg/Vysion/
          (cd pkg && zip -r "../build/Vysion-$VERSION-portable-win64.zip" Vysion)

      - name: Keep test build
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Vysion-${{ env.VERSION }}
          path: |
            build/Vysion-Setup-*.exe
            build/Vysion-*-portable-win64.zip

      - name: Upload to release
        if: env.TAG != ''
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "build/Vysion-Setup-$VERSION.exe" "build/Vysion-$VERSION-portable-win64.zip"
